name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # ─────────────────────────────────────────────
  # Build EAS Production (iOS + Android)
  # ─────────────────────────────────────────────
  build-mobile:
    name: Build EAS Production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Configure Sentry environment for EAS
        # Pousse SENTRY_AUTH_TOKEN comme secret EAS pour que le plugin @sentry/react-native/expo
        # puisse uploader les source maps lors du build EAS (dé-obfuscation des stack traces).
        # Secret GitHub requis : SENTRY_AUTH_TOKEN (Internal Integration token Sentry,
        # scope project:releases + org:read)
        run: |
          eas secret:push --scope project --non-interactive \
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
        working-directory: apps/mobile

      - name: Build production (iOS + Android)
        working-directory: apps/mobile
        run: eas build --platform all --profile production --non-interactive

  # ─────────────────────────────────────────────
  # Deploy Backend to Cloud Run (après build mobile réussi)
  # ─────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend to Cloud Run
    needs: [build-mobile]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write  # Requis pour Workload Identity Federation (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/518388457741/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: wikihop-backend@wikihop-prod.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            -f apps/backend/Dockerfile \
            -t europe-west1-docker.pkg.dev/wikihop-prod/wikihop/backend:${{ github.sha }} \
            -t europe-west1-docker.pkg.dev/wikihop-prod/wikihop/backend:latest \
            .

      - name: Push to Artifact Registry
        run: |
          docker push europe-west1-docker.pkg.dev/wikihop-prod/wikihop/backend:${{ github.sha }}
          docker push europe-west1-docker.pkg.dev/wikihop-prod/wikihop/backend:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy wikihop-backend \
            --image europe-west1-docker.pkg.dev/wikihop-prod/wikihop/backend:${{ github.sha }} \
            --region europe-west1 \
            --platform managed \
            --add-cloudsql-instances wikihop-prod:europe-west1:wikihop-prod \
            --set-secrets DATABASE_URL=WIKIHOP_DATABASE_URL:latest,NODE_ENV=WIKIHOP_NODE_ENV:latest \
            --allow-unauthenticated \
            --port 3000 \
            --project wikihop-prod

      - name: Verify health check
        run: |
          SERVICE_URL=$(gcloud run services describe wikihop-backend \
            --region europe-west1 \
            --project wikihop-prod \
            --format 'value(status.url)')
          echo "Service URL: $SERVICE_URL"
          curl --fail --silent --show-error "$SERVICE_URL/health"
          echo "Health check passed"

  # ─────────────────────────────────────────────
  # Notification d'échec (GitHub Issue automatique)
  # ─────────────────────────────────────────────
  notify-failure:
    name: Notify on failure
    needs: [build-mobile, deploy-backend]
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Release failed: ${context.ref}`,
              body: `Le pipeline de release a échoué.\n\nRun : ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug', 'release']
            })
