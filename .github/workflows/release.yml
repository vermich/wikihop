name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # ─────────────────────────────────────────────
  # Build EAS Production (iOS + Android)
  # ─────────────────────────────────────────────
  build-mobile:
    name: Build EAS Production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Configure Sentry environment for EAS
        # Pousse SENTRY_AUTH_TOKEN comme secret EAS pour que le plugin @sentry/react-native/expo
        # puisse uploader les source maps lors du build EAS (dé-obfuscation des stack traces).
        # Secret GitHub requis : SENTRY_AUTH_TOKEN (Internal Integration token Sentry,
        # scope project:releases + org:read)
        run: |
          eas secret:push --scope project --non-interactive \
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
        working-directory: apps/mobile

      - name: Build production (iOS + Android)
        working-directory: apps/mobile
        run: eas build --platform all --profile production --non-interactive

  # ─────────────────────────────────────────────
  # Deploy Backend (après build mobile réussi)
  # ─────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend
    needs: [build-mobile]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Deploy to production
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_HOST \
            "cd /opt/wikihop && \
             git fetch --tags && \
             git checkout ${{ github.ref_name }} && \
             cd apps/backend && \
             npm ci --omit=dev && \
             npm run db:migrate && \
             pm2 reload wikihop-backend"

  # ─────────────────────────────────────────────
  # Notification d'échec (GitHub Issue automatique)
  # ─────────────────────────────────────────────
  notify-failure:
    name: Notify on failure
    needs: [build-mobile, deploy-backend]
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Release failed: ${context.ref}`,
              body: `Le pipeline de release a échoué.\n\nRun : ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug', 'release']
            })
